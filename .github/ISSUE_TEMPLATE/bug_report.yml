name: Bug Report
description: Create a report to help us improve Fillify
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please ensure you have tested the latest version before submitting.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the problem...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Open Fillify at '...'
        2. Paste template '...'
        3. Click on '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Workspace Mode
      description: In which mode did this issue occur?
      options:
        - Template Editor
        - Wizard Mode
        - Form Mode
        - Bulk Spreadsheet Mode
        - Live Preview / Print
        - Import / Export JSON
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser & OS
      description: e.g. Chrome 125 on Windows 11, Safari 17 on macOS Sonoma, Firefox on Android
      placeholder: Chrome / Windows
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Verification
      options:
        - label: I have verified this is not a duplicate of an existing issue.
          required: true
        - label: I have tested in an incognito/private browser window without extensions.
          required: false
